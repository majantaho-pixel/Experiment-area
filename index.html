<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merge 2048 – Smart FX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:radial-gradient(circle at top,#111,#050505);
  font-family:system-ui,Arial;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.game{width:360px}
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}
.box{
  background:#1a1a1a;
  padding:8px 14px;
  border-radius:12px;
  font-weight:600;
}
.board{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  background:#0c0c0c;
  padding:6px;
  border-radius:16px;
}
.col{
  background:#151515;
  border-radius:14px;
  min-height:300px;
  display:flex;
  flex-direction:column-reverse;
  padding:5px;
  cursor:pointer;
}

/* ===== TILE ===== */
.tile{
  position:relative;
  height:46px;
  margin:4px 0;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:16px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -2px 6px rgba(0,0,0,.35),
    0 6px 14px rgba(0,0,0,.45);
}

/* NEW TILE DROP (only new one) */
.new{
  animation:drop .28s cubic-bezier(.18,.89,.32,1.28);
}
@keyframes drop{
  from{transform:translateY(-22px) scale(.9);opacity:.3}
  to{transform:none;opacity:1}
}

/* MERGE PULSE */
.merge{
  animation:merge .25s ease-out;
}
@keyframes merge{
  0%{transform:scale(1)}
  50%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

/* SPARKS */
.spark{
  position:absolute;
  width:6px;
  height:6px;
  background:gold;
  border-radius:50%;
  animation:spark .45s ease-out forwards;
}
@keyframes spark{
  from{transform:scale(1);opacity:1}
  to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}
}

/* COLORS */
.n16{background:linear-gradient(135deg,#55efc4,#00b894)}
.n32{background:linear-gradient(135deg,#00cec9,#0984e3)}
.n64{background:linear-gradient(135deg,#74b9ff,#6c5ce7)}
.n128{background:linear-gradient(135deg,#a29bfe,#6c5ce7)}
.n256{background:linear-gradient(135deg,#ff7675,#e84393)}
.n512{background:linear-gradient(135deg,#fab1a0,#e17055)}
.n1024{background:linear-gradient(135deg,#ffeaa7,#fdcb6e);color:#000}
.n2048{background:linear-gradient(135deg,#81ecec,#00cec9);color:#000}
.n4096{background:linear-gradient(135deg,#74b9ff,#0984e3)}
.n8192{
  background:linear-gradient(135deg,#f9ca24,#fff3b0);
  color:#000;
  box-shadow:0 0 18px rgba(249,202,36,.9);
}

/* CONTROLS */
.controls{margin-top:12px;text-align:center}
.next{
  background:#1b1b1b;
  padding:10px;
  border-radius:14px;
  margin-bottom:8px;
  font-size:18px;
}
button{
  width:100%;
  padding:11px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#00b894,#019875);
  color:#fff;
  font-size:16px;
}
</style>
</head>

<body>

<div class="game">
  <div class="top">
    <div class="box">Score: <span id="score">0</span></div>
    <div class="box">SMART FX</div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <div class="next">Next: <span id="next">128</span></div>
    <button onclick="resetGame()">Restart</button>
  </div>
</div>

<!-- SOUNDS -->
<audio id="dropSound" src="https://assets.mixkit.co/sfx/preview/mixkit-soft-click-1123.mp3"></audio>
<audio id="mergeSound" src="https://assets.mixkit.co/sfx/preview/mixkit-magical-coin-win-1936.mp3"></audio>

<script>
const COLS=5, MAX_HEIGHT=6;
let board=[], score=0, nextTile;

const boardDiv=document.getElementById("board");
const scoreSpan=document.getElementById("score");
const nextSpan=document.getElementById("next");
const dropSound=document.getElementById("dropSound");
const mergeSound=document.getElementById("mergeSound");

function randomTile(){
  return [16,32,64,128][Math.floor(Math.random()*4)];
}

function init(){
  board=Array.from({length:COLS},()=>[]);
  score=0;
  nextTile=randomTile();
  draw();
}

function draw(newPos=null, mergedPos=null){
  boardDiv.innerHTML="";
  scoreSpan.textContent=score;
  nextSpan.textContent=nextTile;

  board.forEach((col,ci)=>{
    const c=document.createElement("div");
    c.className="col";
    c.onclick=()=>drop(ci);

    col.forEach((v,ri)=>{
      const t=document.createElement("div");
      t.className="tile n"+v;

      if(newPos && newPos.c===ci && newPos.r===ri)
        t.classList.add("new");

      if(mergedPos && mergedPos.c===ci && mergedPos.r===ri){
        t.classList.add("merge");
        createSparks(t);
      }

      t.textContent=v>=8192?"👑 "+v:v;
      c.appendChild(t);
    });
    boardDiv.appendChild(c);
  });
}

function createSparks(tile){
  for(let i=0;i<6;i++){
    const s=document.createElement("div");
    s.className="spark";
    s.style.setProperty("--x",(Math.random()*40-20)+"px");
    s.style.setProperty("--y",(Math.random()*40-20)+"px");
    tile.appendChild(s);
    setTimeout(()=>s.remove(),450);
  }
}

function drop(c){
  if(board[c].length>=MAX_HEIGHT) return;

  dropSound.currentTime=0; dropSound.play();
  board[c].push(nextTile);

  let newPos={c:c,r:board[c].length-1};
  let mergedPos=null;

  while(board[c].length>=2){
    let a=board[c].at(-1), b=board[c].at(-2);
    if(a===b){
      board[c].pop(); board[c].pop();
      let nv=a*2;
      board[c].push(nv);
      score+=nv;
      mergedPos={c:c,r:board[c].length-1};
      mergeSound.currentTime=0; mergeSound.play();
    } else break;
  }

  nextTile=randomTile();
  draw(newPos, mergedPos);
  checkGameOver();
}

function checkGameOver(){
  if(board.every(c=>c.length>=MAX_HEIGHT)){
    alert("Game Over\nScore: "+score);
  }
}

function resetGame(){init()}
init();
</script>

</body>
</html>
