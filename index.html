<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>Merge 🔢 Fun Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#0b0f1a;
  font-family:system-ui;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.game{width:360px}
.top{display:flex;justify-content:space-between;margin-bottom:10px}
.box{background:#151a2c;padding:8px 12px;border-radius:10px}
.board{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
  background:#0f1322;
  padding:8px;
  border-radius:16px;
}
.cell{
  height:48px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:16px;
  transition:.2s;
}
.empty{background:#1a1f36}
.n16{background:#00b894}
.n32{background:#0984e3}
.n64{background:#6c5ce7}
.n128{background:#a29bfe}
.merge{transform:scale(1.2)}
.controls{margin-top:10px;text-align:center}
button{width:100%;padding:10px;border:none;border-radius:10px;background:#00b894;color:#fff;font-size:16px}
#medals{display:flex;gap:6px;margin-top:6px;font-size:22px}
</style>
</head>

<body>

<div class="game">
  <div class="top">
    <div class="box">Level <span id="level">1</span></div>
    <div class="box">Score <span id="score">0</span></div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <div class="box">Next: <span id="next">16</span></div>
    <button onclick="reset()">Reset</button>
    <div id="medals"></div>
  </div>
</div>

<script>
const ROWS=7, COLS=6;
let board=[], score=0, level=1;
let nextTile=16;
const medals=["🥉","🥈","🥇","💎","👑"];

const boardDiv=document.getElementById("board");
const scoreSpan=document.getElementById("score");
const levelSpan=document.getElementById("level");
const nextSpan=document.getElementById("next");
const medalsDiv=document.getElementById("medals");

function init(){
  board=[];
  for(let r=0;r<ROWS;r++){
    board[r]=Array(COLS).fill(0);
  }

  // starter tiles
  for(let i=0;i<10;i++){
    let r=Math.floor(Math.random()*ROWS);
    let c=Math.floor(Math.random()*COLS);
    board[r][c]=Math.random()<0.7?16:32;
  }
  draw();
}

function draw(){
  boardDiv.innerHTML="";
  board.forEach((row,r)=>{
    row.forEach((v,c)=>{
      const d=document.createElement("div");
      d.className="cell "+(v?("n"+v):"empty");
      d.textContent=v||"";
      d.onclick=()=>drop(r,c);
      boardDiv.appendChild(d);
    });
  });
  scoreSpan.textContent=score;
  levelSpan.textContent=level;
  nextSpan.textContent=nextTile;
}

function drop(r,c){
  if(board[r][c]!==0) return;
  board[r][c]=nextTile;
  mergeAll();
  nextTile=Math.random()<0.6?16:32;
  draw();
}

function mergeAll(){
  let merged=false;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      let v=board[r][c];
      if(!v) continue;

      if(c+1<COLS && board[r][c+1]===v){
        board[r][c]*=2;
        board[r][c+1]=0;
        score+=board[r][c];
        merged=true;
      }

      if(r+1<ROWS && board[r+1][c]===v){
        board[r][c]*=2;
        board[r+1][c]=0;
        score+=board[r][c];
        merged=true;
      }
    }
  }
  if(merged){
    level++;
    medalsDiv.innerHTML+=`<div>${medals[Math.min(level-1,4)]}</div>`;
    setTimeout(mergeAll,150);
  }
}

function reset(){
  score=0;level=1;
  medalsDiv.innerHTML="";
  init();
}

init();
</script>

</body>
</html>
