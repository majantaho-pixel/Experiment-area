<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merge 2048 – LEVEL SYSTEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:radial-gradient(circle at top,#111,#050505);
  font-family:system-ui,Arial;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.game{width:360px}
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}
.box{
  background:#1a1a1a;
  padding:6px 10px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
}
.board{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  background:#0c0c0c;
  padding:6px;
  border-radius:14px;
}
.col{
  background:#141414;
  border-radius:12px;
  min-height:280px;
  display:flex;
  flex-direction:column-reverse;
  padding:5px;
}
.tile{
  height:44px;
  margin:4px 0;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  animation:drop .25s;
}
@keyframes drop{
  from{transform:translateY(-20px);opacity:.3}
  to{transform:none;opacity:1}
}
.n16{background:#2ecc71}
.n32{background:#27ae60}
.n64{background:#3498db}
.n128{background:#9b59b6}
.n256{background:#e84393}
.n512{background:#e17055}
.n1024{background:#fdcb6e;color:#000}
.n2048{background:#00cec9;color:#000}
.n4096{background:#6c5ce7}
.n8192{background:#f9ca24;color:#000}
.n16384{background:#ffeaa7;color:#000}
.controls{text-align:center;margin-top:10px}
.next{background:#1b1b1b;padding:8px;border-radius:10px;margin-bottom:6px}

.celebration{
  position:fixed;
  top:35%;
  font-size:30px;
  font-weight:900;
  animation:celebrate 1s ease forwards;
}
@keyframes celebrate{
  from{opacity:0;transform:scale(.5)}
  40%{opacity:1;transform:scale(1.2)}
  to{opacity:0;transform:scale(1.5)}
}
.muslim{color:gold;text-shadow:0 0 15px gold}

.trophy{
  position:fixed;
  top:10%;
  font-size:36px;
  animation:trophy 1.2s ease forwards;
}
@keyframes trophy{
  from{opacity:0;transform:translateY(-20px)}
  to{opacity:1;transform:none}
}
</style>
</head>

<body>

<div class="game">
  <div class="top">
    <div class="box">Level: <span id="level">1</span></div>
    <div class="box">Target: <span id="target">128</span></div>
    <div class="box">Score: <span id="score">0</span></div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <div class="next">Next: <span id="next">128</span></div>
  </div>
</div>

<script>
const COLS=5, MAX_HEIGHT=6;
let board=[], score=0;
let level=1, nextTile=128;

const levelTargets=[...Array(50)].map((_,i)=>128*Math.pow(2,i));

const celebrations=[
"Awesome!","Incredible!","Bravo!","Fantastic!","Outstanding!",
"Magnificent!","Unstoppable!","Legend Rising!","Power Unlocked!",
"Victory!","Champion!","Elite!","Masterclass!","Glorious!","Divine Move!"
];

const muslimTexts=[
"✨ Alhamdulillah ✨",
"✨ SubhanAllah ✨",
"✨ MashaAllah ✨",
"✨ Allahu Akbar ✨"
];

const trophies=["🥉 Bronze","🥈 Silver","🥇 Gold","💎 Epic","👑 Legendary"];

const boardDiv=document.getElementById("board");
const scoreSpan=document.getElementById("score");
const nextSpan=document.getElementById("next");
const levelSpan=document.getElementById("level");
const targetSpan=document.getElementById("target");

function save(){
  localStorage.setItem("mergeSave",JSON.stringify({board,score,level,nextTile}));
}
function load(){
  const s=localStorage.getItem("mergeSave");
  if(s){
    const d=JSON.parse(s);
    board=d.board; score=d.score; level=d.level; nextTile=d.nextTile;
  }else{
    board=Array.from({length:COLS},()=>[]);
  }
}
function draw(){
  boardDiv.innerHTML="";
  board.forEach((col,i)=>{
    const c=document.createElement("div");
    c.className="col";
    c.onclick=()=>drop(i);
    col.forEach(v=>{
      const t=document.createElement("div");
      t.className="tile n"+v;
      t.textContent=v;
      c.appendChild(t);
    });
    boardDiv.appendChild(c);
  });
  scoreSpan.textContent=score;
  nextSpan.textContent=nextTile;
  levelSpan.textContent=level;
  targetSpan.textContent=levelTargets[level-1];
}

function celebrate(){
  const d=document.createElement("div");
  const isMuslim=level>=30;
  d.className="celebration"+(isMuslim?" muslim":"");
  d.textContent=isMuslim
    ? muslimTexts[Math.floor(Math.random()*muslimTexts.length)]
    : celebrations[Math.floor(Math.random()*celebrations.length)];
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1000);
}

function trophy(){
  if(level%10===0){
    const t=document.createElement("div");
    t.className="trophy";
    t.textContent=trophies[Math.floor(level/10)-1];
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),2000);
  }
}

function drop(c){
  if(board[c].length>=MAX_HEIGHT)return;
  board[c].push(nextTile);

  while(board[c].length>=2){
    let a=board[c].at(-1),b=board[c].at(-2);
    if(a===b){
      board[c].pop();board[c].pop();
      let nv=a*2;
      board[c].push(nv);
      score+=nv;
      if(nv>=levelTargets[level-1]){
        level++;
        celebrate();
        trophy();
      }
    }else break;
  }
  nextTile=[16,32,64,128][Math.floor(Math.random()*4)];
  save();
  draw();
}

load();
draw();
</script>

</body>
</html>
