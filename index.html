<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merge🔢 – Fixed Gameplay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;background:#05050a;color:#fff;
  font-family:system-ui;
  display:flex;justify-content:center;
}
.game{width:420px;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center}
.board{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:6px;background:#0d0d1a;
  padding:8px;border-radius:18px;
  height:420px;position:relative;
}
.col{
  background:#121212;border-radius:14px;
  display:flex;flex-direction:column-reverse;
  padding:6px;
}
.tile{
  height:48px;margin:4px 0;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;
}
.drag{
  position:absolute;top:-60px;left:0;right:0;
  margin:auto;width:70px;height:48px;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:#a29bfe;font-weight:900;
  touch-action:none;
}
.info,.bottom{
  display:grid;grid-template-columns:1fr 1fr 1fr auto;
  gap:6px;margin:8px 0;
}
.box{
  background:#1a1a1a;border-radius:12px;
  padding:6px;text-align:center;font-weight:700;
}
.rank-popup{
  position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  display:flex;align-items:center;justify-content:center;
  font-size:64px;animation:pop 1.2s forwards;
}
@keyframes pop{
  0%{opacity:0;transform:scale(.3)}
  40%{opacity:1;transform:scale(1.2)}
  100%{opacity:0}
}
</style>
</head>

<body>
<div class="game">
  <div class="top">
    <b>Merge</b>
    <span id="rankBox"></span>
  </div>

  <div class="info">
    <div class="box">Level<br><span id="level">1</span></div>
    <div class="box">Target<br><span id="target">128</span></div>
    <div class="box">Score<br><span id="score">0</span></div>
    <div class="box">Next<br><span id="next">128</span></div>
  </div>

  <div class="board" id="board"></div>
  <div class="drag" id="drag">128</div>

  <div class="bottom">
    <button onclick="resetGame()">Reset</button>
  </div>
</div>

<script>
const COLS=5,MAX=6;
let board=[...Array(COLS)].map(()=>[]);
let score=0,level=1,target=128,next=128;

const ranks=[
  {l:2,i:"🥉"},{l:4,i:"🥈"},{l:6,i:"🥇"},
  {l:8,i:"💎"},{l:10,i:"🔷"},{l:12,i:"🔥"},
  {l:14,i:"👑"},{l:16,i:"🏆"},{l:18,i:"🎖️"},{l:20,i:"⭐"}
];

const boardEl=document.getElementById("board");
const drag=document.getElementById("drag");

function nextTileByTarget(){
  let pool=[16,32,64,128,256,512,1024];
  let allowed=pool.filter(v=>v<=target/2);
  return allowed[Math.floor(Math.random()*allowed.length)];
}

function draw(){
  boardEl.innerHTML="";
  board.forEach(c=>{
    let col=document.createElement("div");
    col.className="col";
    c.forEach(v=>{
      let t=document.createElement("div");
      t.className="tile";
      t.style.background="#a29bfe";
      t.textContent=v;
      col.appendChild(t);
    });
    boardEl.appendChild(col);
  });
  levelEl.textContent=level;
  targetEl.textContent=target;
  scoreEl.textContent=score;
  nextEl.textContent=next;
  drag.textContent=next;
}

drag.onpointerdown=e=>{
  drag.setPointerCapture(e.pointerId);
};
drag.onpointermove=e=>{
  drag.style.left=e.clientX-35+"px";
};
drag.onpointerup=e=>{
  let col=Math.floor((e.clientX-boardEl.offsetLeft)/(boardEl.clientWidth/COLS));
  if(col>=0 && col<COLS && board[col].length<MAX){
    board[col].push(next);
    merge(col);
    next=nextTileByTarget();
  }
  drag.style.left="0";
  draw();
};

function merge(c){
  while(board[c].length>=2){
    let a=board[c].at(-1),b=board[c].at(-2);
    if(a===b){
      board[c].pop();board[c].pop();
      let nv=a*2;
      board[c].push(nv);
      score+=nv;
      if(nv>=target){
        level++;target*=2;checkRank();
      }
    }else break;
  }
}

function checkRank(){
  let r=ranks.find(x=>x.l===level);
  if(r){
    rankBox.textContent=r.i;
    let p=document.createElement("div");
    p.className="rank-popup";p.textContent=r.i;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1200);
  }
}

function resetGame(){
  board=[...Array(COLS)].map(()=>[]);
  score=0;level=1;target=128;
  next=128;rankBox.textContent="";
  draw();
}

draw();
</script>
</body>
</html>
