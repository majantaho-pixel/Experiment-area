<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merge – by Zeeshan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{--radius:14px;}
body{
  margin:0;
  background:radial-gradient(circle at top,#0c0c20,#05050a);
  font-family:system-ui,Segoe UI,Arial;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* ===== STARS ===== */
@keyframes stars{from{transform:translateY(0)}to{transform:translateY(-1000px)}}
.star{
  position:absolute;width:2px;height:2px;
  background:white;border-radius:50%;
  animation:stars linear infinite;
}

/* ===== GAME ===== */
.game{width:360px}
.topbar{
  display:flex;align-items:center;
  justify-content:space-between;
  margin-bottom:6px;
}
.menu-btn{font-size:20px;cursor:pointer}
.game-title{font-weight:800}
.creator{font-size:12px;opacity:.8}

/* ===== SECOND BAR ===== */
.info-bar{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:6px;
  margin-bottom:8px;
}
.box{
  background:linear-gradient(145deg,#1e1e1e,#141414);
  padding:6px;
  border-radius:12px;
  text-align:center;
  font-weight:600;
  box-shadow:inset 0 0 0 1px #2a2a2a;
}
.hint{
  width:36px;height:36px;
  border-radius:50%;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* ===== BOARD ===== */
.board{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  background:#0d0d1a;
  padding:6px;
  border-radius:18px;
}
.col{
  background:linear-gradient(#161616,#101010);
  border-radius:16px;
  min-height:300px;
  display:flex;
  flex-direction:column-reverse;
  padding:5px;
  cursor:pointer;
}
.tile{
  height:46px;margin:4px 0;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

/* ===== COLORS ===== */
.n16{background:#55efc4}
.n32{background:#00cec9}
.n64{background:#74b9ff}
.n128{background:#a29bfe}
.n256{background:#ff7675}
.n512{background:#fab1a0}
.n1024{background:#ffeaa7;color:#000}
.n2048{background:#81ecec;color:#000}
.n4096{background:#74b9ff}
.n8192{background:#f9ca24;color:#000}

/* ===== BOTTOM ===== */
.bottom{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin-top:8px;
}
button{
  border:none;
  border-radius:12px;
  padding:8px;
  background:#00b894;
  color:#fff;
  font-weight:700;
}

/* ===== MENU ===== */
.menu{
  position:fixed;
  left:-260px;
  top:0;
  width:240px;
  height:100%;
  background:#111;
  transition:.3s;
  padding:12px;
}
.menu.open{left:0}
.menu h3{margin:0 0 8px}

/* ===== RANK ===== */
.rank-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:900;
  animation:pop 1.2s forwards;
}
@keyframes pop{
  0%{transform:scale(.3);opacity:0}
  40%{transform:scale(1.2);opacity:1}
  100%{transform:scale(1);opacity:0}
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="menu" id="menu">
  <h3>Player</h3>
  <div id="history"></div>
</div>

<div class="game">
  <!-- TOP -->
  <div class="topbar">
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <div class="game-title">Merge</div>
    <div class="creator">by Zeeshan</div>
  </div>

  <!-- INFO -->
  <div class="info-bar">
    <div class="box">Rank<br><span id="rank">Bronze</span></div>
    <div class="box">Next<br><span id="next">128</span></div>
    <div class="box">Score<br><span id="score">0</span></div>
    <div class="hint">❓</div>
  </div>

  <!-- BOARD -->
  <div class="board" id="board"></div>

  <!-- BOTTOM -->
  <div class="bottom">
    <div class="box">Level<br><span id="level">1</span></div>
    <div class="box">Target<br><span id="target">128</span></div>
    <button onclick="resetGame()">Reset</button>
  </div>
</div>

<script>
/* ===== STARS ===== */
const stars=document.getElementById("stars");
for(let i=0;i<80;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.animationDuration=5+Math.random()*10+"s";
  stars.appendChild(s);
}

/* ===== GAME LOGIC (UNCHANGED) ===== */
const COLS=5,MAX=6;
let board=Array.from({length:COLS},()=>[]);
let score=0,level=1,nextTile=128;

const ranks=[
"Bronze","Silver","Gold","Platinum","Diamond",
"Heroic","Elite Heroic","Master","Elite Master","Grandmaster"
];

function draw(){
  boardEl.innerHTML="";
  board.forEach((c,i)=>{
    let col=document.createElement("div");
    col.className="col";
    col.onclick=()=>drop(i);
    c.forEach(v=>{
      let t=document.createElement("div");
      t.className="tile n"+v;
      t.textContent=v;
      col.appendChild(t);
    });
    boardEl.appendChild(col);
  });
  scoreEl.textContent=score;
  levelEl.textContent=level;
  targetEl.textContent=128*Math.pow(2,level-1);
  nextEl.textContent=nextTile;
  rankEl.textContent=ranks[Math.floor((level-1)/3)]||ranks.at(-1);
}

function drop(c){
  if(board[c].length>=MAX)return;
  board[c].push(nextTile);
  while(board[c].length>=2){
    let a=board[c].at(-1),b=board[c].at(-2);
    if(a===b){
      board[c].pop();board[c].pop();
      let nv=a*2;
      board[c].push(nv);
      score+=nv;
      if(nv>=128*Math.pow(2,level-1)){
        level++;
        if(level%3===0)showRank();
      }
    }else break;
  }
  nextTile=[16,32,64,128][Math.floor(Math.random()*4)];
  draw();
}

function showRank(){
  let d=document.createElement("div");
  d.className="rank-popup";
  d.textContent=ranks[Math.floor((level-1)/3)];
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1200);
}

function resetGame(){
  board=Array.from({length:COLS},()=>[]);
  score=0;level=1;nextTile=128;
  draw();
}

function toggleMenu(){
  document.getElementById("menu").classList.toggle("open");
}

/* INIT */
const boardEl=document.getElementById("board");
const scoreEl=document.getElementById("score");
const levelEl=document.getElementById("level");
const targetEl=document.getElementById("target");
const nextEl=document.getElementById("next");
const rankEl=document.getElementById("rank");

draw();
</script>

</body>
</html>
