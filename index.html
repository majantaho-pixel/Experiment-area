<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Professional Ludo – Single File</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#1b1b1b;
  color:#fff;
  text-align:center;
}
h1{margin:10px 0}

#board{
  width:360px;
  height:360px;
  margin:10px auto;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(6,1fr);
  border:3px solid #fff;
}

.cell{
  border:1px solid #444;
  position:relative;
}

.token{
  width:18px;
  height:18px;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.red{background:red}
.green{background:green}
.yellow{background:yellow}
.blue{background:blue}

#panel{
  margin-top:10px;
}

button{
  padding:10px 20px;
  font-size:16px;
  margin:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>🎲 Professional Ludo</h1>

<div id="board"></div>

<div id="panel">
  <h3 id="turnInfo">Turn: Red</h3>
  <h2 id="dice">🎲 0</h2>
  <button onclick="rollDice()">Roll Dice</button>
  <button onclick="resetGame()">Reset Game</button>
</div>

<script>
/* ---------- BOARD ---------- */
const board = document.getElementById("board");
const pathLength = 36;

for(let i=0;i<pathLength;i++){
  const c=document.createElement("div");
  c.className="cell";
  c.id="cell"+i;
  board.appendChild(c);
}

/* ---------- GAME STATE ---------- */
let state = JSON.parse(localStorage.getItem("ludoState")) || {
  currentPlayer:0,
  dice:0,
  players:[
    {color:"red",pos:0},
    {color:"green",pos:0},
    {color:"yellow",pos:0},
    {color:"blue",pos:0}
  ]
};

const colors=["Red","Green","Yellow","Blue"];

/* ---------- RENDER ---------- */
function render(){
  document.querySelectorAll(".token").forEach(t=>t.remove());

  state.players.forEach((p,i)=>{
    if(p.pos < pathLength){
      const token=document.createElement("div");
      token.className="token "+p.color;
      document.getElementById("cell"+p.pos).appendChild(token);
    }
  });

  document.getElementById("turnInfo").innerText=
    "Turn: "+colors[state.currentPlayer];
  document.getElementById("dice").innerText="🎲 "+state.dice;

  localStorage.setItem("ludoState",JSON.stringify(state));
}

/* ---------- DICE ---------- */
function rollDice(){
  state.dice = Math.floor(Math.random()*6)+1;
  moveToken();
}

/* ---------- MOVE ---------- */
function moveToken(){
  let p = state.players[state.currentPlayer];
  p.pos += state.dice;

  if(p.pos >= pathLength){
    alert(colors[state.currentPlayer]+" Wins!");
    resetGame();
    return;
  }

  // CUT LOGIC
  state.players.forEach((op,i)=>{
    if(i!==state.currentPlayer && op.pos===p.pos){
      op.pos=0;
    }
  });

  // NEXT TURN
  state.currentPlayer = (state.currentPlayer+1)%4;
  render();
}

/* ---------- RESET ---------- */
function resetGame(){
  localStorage.removeItem("ludoState");
  state={
    currentPlayer:0,
    dice:0,
    players:[
      {color:"red",pos:0},
      {color:"green",pos:0},
      {color:"yellow",pos:0},
      {color:"blue",pos:0}
    ]
  };
  render();
}

/* ---------- START ---------- */
render();
</script>

</body>
</html>
