<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merge 2048 Columns Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#0f0f0f;
    font-family: Arial, sans-serif;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.game{
    width:360px;
}
.top{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}
.score{
    background:#222;
    padding:8px 14px;
    border-radius:8px;
    font-weight:bold;
}
.board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    background:#111;
    padding:6px;
    border-radius:10px;
}
.col{
    background:#1c1c1c;
    border-radius:8px;
    min-height:260px;
    display:flex;
    flex-direction:column-reverse;
    padding:4px;
}
.tile{
    margin:3px 0;
    height:42px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:16px;
}
.n16{background:#2ecc71}
.n32{background:#27ae60}
.n64{background:#3498db}
.n128{background:#9b59b6}
.n256{background:#e84393}
.n512{background:#00cec9}
.n1024{background:#d63031}
.n2048{background:#0984e3}
.n4096{background:#6c5ce7}
.n8192{background:#fdcb6e;color:#000}

.controls{
    margin-top:12px;
    text-align:center;
}
.next{
    display:inline-block;
    background:#333;
    padding:10px 18px;
    border-radius:10px;
    margin-bottom:8px;
    font-size:18px;
}
button{
    margin-top:6px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#00b894;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#019875;
}
</style>
</head>

<body>

<div class="game">
    <div class="top">
        <div class="score">Score: <span id="score">0</span></div>
        <div class="score">Best</div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
        <div class="next">
            Next: <span id="next">128</span>
        </div>
        <button onclick="resetGame()">Restart Game</button>
    </div>
</div>

<script>
const COLS = 5;
const MAX_HEIGHT = 6;
let board = [];
let score = 0;
let nextTile = randomTile();

const boardDiv = document.getElementById("board");
const scoreSpan = document.getElementById("score");
const nextSpan = document.getElementById("next");

function randomTile(){
    const base = [16,32,64,128];
    return base[Math.floor(Math.random()*base.length)];
}

function init(){
    board = Array.from({length:COLS},()=>[]);
    score = 0;
    nextTile = randomTile();
    draw();
}

function draw(){
    boardDiv.innerHTML="";
    scoreSpan.textContent = score;
    nextSpan.textContent = nextTile;

    board.forEach((col,colIndex)=>{
        const colDiv = document.createElement("div");
        colDiv.className="col";
        colDiv.onclick = ()=>drop(colIndex);

        col.forEach(v=>{
            const t = document.createElement("div");
            t.className = "tile n"+v;
            t.textContent = v;
            colDiv.appendChild(t);
        });

        boardDiv.appendChild(colDiv);
    });
}

function drop(c){
    if(board[c].length>=MAX_HEIGHT) return;

    let value = nextTile;
    board[c].push(value);

    while(board[c].length>=2){
        let a = board[c][board[c].length-1];
        let b = board[c][board[c].length-2];
        if(a===b){
            board[c].pop();
            board[c].pop();
            let nv = a*2;
            board[c].push(nv);
            score += nv;
        }else break;
    }

    nextTile = randomTile();
    draw();
    checkGameOver();
}

function checkGameOver(){
    for(let c=0;c<COLS;c++){
        if(board[c].length<MAX_HEIGHT) return;
    }
    alert("Game Over!\nScore: "+score);
}

function resetGame(){
    init();
}

init();
</script>

</body>
</html>
