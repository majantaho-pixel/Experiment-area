<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Swipe Drop Merge Fixed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#0b1020;
  font-family:system-ui;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:#fff;
}
.game{position:relative;width:360px;}
.board{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(7,50px);
  gap:6px;
  background:#111634;
  padding:8px;
  border-radius:16px;
  position:relative;
}
.cell{
  background:#1a1f40;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:16px;
}
.tile{
  position:absolute;
  width:50px;height:50px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  transition: left 0.15s linear, top 0.15s linear;
  z-index:10;
}
.n16{background:#00b894}
.n32{background:#0984e3}
.n64{background:#6c5ce7}
.n128{background:#a29bfe}
.n256{background:#e84393}
.merge{
  transition: transform 0.5s ease-in-out;
}
</style>
</head>
<body>
<div class="game">
  <div class="board" id="board"></div>
</div>

<script>
const ROWS=7, COLS=6;
const board=[];
const boardDiv=document.getElementById("board");
for(let r=0;r<ROWS;r++) board[r]=Array(COLS).fill(0);

let activeTile=null;
let activeCol=Math.floor(COLS/2);
let fallInterval=null;
let tileCounter=0;

/* Draw board cells (fixed grid) */
function drawBoard(){
  boardDiv.innerHTML="";
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cell=document.createElement("div");
      cell.className="cell";
      cell.textContent=board[r][c]?board[r][c]:"";
      if(board[r][c]) cell.classList.add("n"+board[r][c]);
      boardDiv.appendChild(cell);
    }
  }
}

/* Spawn a new tile */
function spawnTile(){
  activeCol=Math.floor(COLS/2);
  activeTile={value:Math.random()<0.7?16:32,row:0,col:activeCol,id:++tileCounter};
  renderActive();
  startFall();
}

/* Render active tile above the board */
function renderActive(){
  let t=document.getElementById("activeTile");
  if(!t){
    t=document.createElement("div");
    t.id="activeTile";
    t.className="tile n"+activeTile.value;
    t.textContent=activeTile.value;
    t.dataset.id=activeTile.id;
    document.body.appendChild(t);
  } else {
    t.className="tile n"+activeTile.value;
    t.textContent=activeTile.value;
    t.dataset.id=activeTile.id;
  }
  const rect=boardDiv.getBoundingClientRect();
  t.style.left=rect.left+activeTile.col*56+"px";
  t.style.top=rect.top + activeTile.row*56 + "px";
}

/* Continuous fall */
function startFall(){
  if(fallInterval) clearInterval(fallInterval);
  fallInterval=setInterval(()=>{
    if(activeTile.row+1<ROWS && board[activeTile.row+1][activeTile.col]===0){
      activeTile.row++;
      renderActive();
    } else {
      placeTile();
    }
  },200);
}

/* Place tile permanently */
function placeTile(){
  clearInterval(fallInterval);
  board[activeTile.row][activeTile.col]=activeTile.value;

  // Create permanent tile div
  const rect=boardDiv.getBoundingClientRect();
  const t=document.createElement("div");
  t.className="tile n"+activeTile.value;
  t.textContent=activeTile.value;
  t.style.left=rect.left + activeTile.col*56+"px";
  t.style.top=rect.top + activeTile.row*56+"px";
  boardDiv.appendChild(t);

  document.getElementById("activeTile").remove();
  activeTile=null;

  mergeAll();
  drawBoard();
  setTimeout(spawnTile,300);
}

/* Merge logic */
function mergeAll(){
  let merged=false;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const val=board[r][c];
      if(!val) continue;
      // Check right
      if(c+1<COLS && board[r][c+1]===val){
        board[r][c]*=2;
        board[r][c+1]=0;
        merged=true;
      }
      // Check down
      if(r+1<ROWS && board[r+1][c]===val){
        board[r][c]*=2;
        board[r+1][c]=0;
        merged=true;
      }
    }
  }
  if(merged){
    drawBoard();
    setTimeout(mergeAll,400); // slow motion
  }
}

/* Swipe / Arrow control */
let startX=0;
document.addEventListener("touchstart",e=>{ if(activeTile) startX=e.touches[0].clientX; });
document.addEventListener("touchmove",e=>{
  if(!activeTile) return;
  const dx=e.touches[0].clientX-startX;
  if(dx>40 && activeTile.col<COLS-1){ activeTile.col++; startX=e.touches[0].clientX; renderActive(); }
  if(dx<-40 && activeTile.col>0){ activeTile.col--; startX=e.touches[0].clientX; renderActive(); }
});
document.addEventListener("keydown",e=>{
  if(!activeTile) return;
  if(e.key==="ArrowLeft" && activeTile.col>0){ activeTile.col--; renderActive(); }
  if(e.key==="ArrowRight" && activeTile.col<COLS-1){ activeTile.col++; renderActive(); }
  if(e.key==="ArrowDown"){ startFall(); }
});

/* Init */
drawBoard();
spawnTile();
</script>
</body>
</html>
