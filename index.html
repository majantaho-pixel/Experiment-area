<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merge🔢 – by Zeeshan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#05050a;
  font-family:system-ui;
  color:#fff;
  display:flex;
  justify-content:center;
}
.game{width:420px;padding:10px}
.topbar{display:flex;justify-content:space-between;align-items:center}
.menu-btn{font-size:22px;cursor:pointer}
.info{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:6px;margin:8px 0;
}
.box{
  background:#1a1a1a;
  padding:6px;
  border-radius:12px;
  text-align:center;
  font-weight:700;
}
.hint{width:36px;height:36px;border-radius:50%;background:#333;
display:flex;align-items:center;justify-content:center}
.board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  background:#0d0d1a;
  padding:8px;
  border-radius:18px;
  height:420px;
}
.col{
  background:#121212;
  border-radius:16px;
  display:flex;
  flex-direction:column-reverse;
  padding:6px;
}
.tile{
  height:50px;
  margin:4px 0;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}
.drag{
  position:absolute;
  top:-60px;
  left:0;
  right:0;
  margin:auto;
  width:70px;
  height:50px;
  border-radius:14px;
  background:#a29bfe;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  touch-action:none;
  transition:.25s;
  z-index:10;
}
.bottom{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;margin-top:8px;
}
button{
  border:none;
  border-radius:12px;
  background:#00b894;
  color:#fff;
  font-weight:700;
}
.menu{
  position:fixed;left:-260px;top:0;
  width:240px;height:100%;
  background:#111;padding:12px;
  transition:.3s;
}
.menu.open{left:0}
.rank-popup{
  position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  display:flex;align-items:center;justify-content:center;
  font-size:64px;
  animation:pop 1.2s forwards;
}
@keyframes pop{
  0%{transform:scale(.3);opacity:0}
  40%{transform:scale(1.2);opacity:1}
  100%{opacity:0}
}
</style>
</head>

<body>

<div class="menu" id="menu">
  <h3>Player</h3>
  <div id="history"></div>
</div>

<div class="game">
  <div class="topbar">
    <div class="menu-btn" onclick="menu.classList.toggle('open')">☰</div>
    <b>Merge</b>
    <small>by Zeeshan</small>
  </div>

  <div class="info">
    <div class="box">🏆<br><span id="rank">🥉</span></div>
    <div class="box">Next<br><span id="next">128</span></div>
    <div class="box">Score<br><span id="score">0</span></div>
    <div class="hint">❓</div>
  </div>

  <div class="board" id="board"></div>
  <div class="drag" id="drag">128</div>

  <div class="bottom">
    <div class="box">Level<br><span id="level">1</span></div>
    <div class="box">Target<br><span id="target">128</span></div>
    <button onclick="resetGame()">Reset</button>
  </div>
</div>

<audio id="rankSound" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>

<script>
const COLS=5,MAX=6;
let board=[...Array(COLS)].map(()=>[]);
let score=0,level=1,next=128;
const ranks=["🥉","🥈","🥇","🎖","🏆","💎","👑"];

const boardEl=document.getElementById("board");
const drag=document.getElementById("drag");
const scoreEl=scoreSpan=scoreEl=document.getElementById("score");
const levelEl=document.getElementById("level");
const targetEl=document.getElementById("target");
const nextEl=document.getElementById("next");
const rankEl=document.getElementById("rank");
const historyEl=document.getElementById("history");
const rankSound=document.getElementById("rankSound");

function draw(){
  boardEl.innerHTML="";
  board.forEach((c,i)=>{
    let col=document.createElement("div");
    col.className="col";
    c.forEach(v=>{
      let t=document.createElement("div");
      t.className="tile";
      t.style.background="#a29bfe";
      t.textContent=v;
      col.appendChild(t);
    });
    boardEl.appendChild(col);
  });
  scoreEl.textContent=score;
  levelEl.textContent=level;
  targetEl.textContent=128*Math.pow(2,level-1);
  nextEl.textContent=next;
  drag.textContent=next;
}

let startX;
drag.addEventListener("pointerdown",e=>{
  startX=e.clientX;
  drag.setPointerCapture(e.pointerId);
});
drag.addEventListener("pointermove",e=>{
  drag.style.left=e.clientX-35+"px";
});
drag.addEventListener("pointerup",e=>{
  let col=Math.floor((e.clientX-boardEl.offsetLeft)/(boardEl.clientWidth/COLS));
  if(col>=0 && col<COLS && board[col].length<MAX){
    board[col].push(next);
    score+=next;
    if(next>=128*Math.pow(2,level-1)){
      level++;
      if(level%3===0)rankUp();
    }
    saveHistory();
    next=[16,32,64,128][Math.floor(Math.random()*4)];
  }
  drag.style.left="0";
  draw();
});

function rankUp(){
  rankSound.play();
  rankEl.textContent=ranks[Math.floor((level-1)/3)]||"🏆";
  let p=document.createElement("div");
  p.className="rank-popup";
  p.textContent=rankEl.textContent;
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),1200);
}

function saveHistory(){
  let d=document.createElement("div");
  d.textContent=`Level ${level} – Score ${score}`;
  historyEl.prepend(d);
}

function resetGame(){
  board=[...Array(COLS)].map(()=>[]);
  score=0;level=1;next=128;
  draw();
}

draw();
</script>

</body>
</html>
