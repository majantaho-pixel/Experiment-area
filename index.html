<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merge 2048 Columns – PRO+</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --radius:14px;
}
body{
  margin:0;
  background:radial-gradient(circle at top,#111,#050505);
  font-family:system-ui,Segoe UI,Arial;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.game{width:360px}
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}
.box{
  background:linear-gradient(145deg,#1e1e1e,#141414);
  padding:8px 14px;
  border-radius:12px;
  font-weight:600;
  box-shadow:inset 0 0 0 1px #2a2a2a;
}
.board{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  background:#0d0d0d;
  padding:6px;
  border-radius:18px;
}
.col{
  background:linear-gradient(#161616,#101010);
  border-radius:16px;
  min-height:300px;
  display:flex;
  flex-direction:column-reverse;
  padding:5px;
  cursor:pointer;
  box-shadow:inset 0 0 0 1px #1f1f1f;
}

/* ===== TILE ===== */
.tile{
  height:46px;
  margin:4px 0;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:16px;
  letter-spacing:.4px;
  animation:drop .28s cubic-bezier(.18,.89,.32,1.28);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -2px 6px rgba(0,0,0,.35),
    0 6px 14px rgba(0,0,0,.45);
}
@keyframes drop{
  from{transform:translateY(-22px) scale(.92);opacity:.2}
  to{transform:none;opacity:1}
}
.merge{
  animation:merge .25s ease-out;
}
@keyframes merge{
  0%{transform:scale(1)}
  50%{transform:scale(1.18)}
  100%{transform:scale(1)}
}

/* ===== COLORS ===== */
.n16{background:linear-gradient(135deg,#55efc4,#00b894)}
.n32{background:linear-gradient(135deg,#00cec9,#0984e3)}
.n64{background:linear-gradient(135deg,#74b9ff,#6c5ce7)}
.n128{background:linear-gradient(135deg,#a29bfe,#6c5ce7)}
.n256{background:linear-gradient(135deg,#ff7675,#e84393)}
.n512{background:linear-gradient(135deg,#fab1a0,#e17055)}
.n1024{background:linear-gradient(135deg,#ffeaa7,#fdcb6e);color:#000}
.n2048{background:linear-gradient(135deg,#81ecec,#00cec9);color:#000}
.n4096{background:linear-gradient(135deg,#74b9ff,#0984e3)}
.n8192,.crown{
  background:linear-gradient(135deg,#f9ca24,#fff3b0);
  color:#000;
  text-shadow:0 1px 0 #fff;
  box-shadow:
    0 0 18px rgba(249,202,36,.9),
    inset 0 1px 0 #fff;
}

/* ===== CONTROLS ===== */
.controls{
  margin-top:12px;
  text-align:center;
}
.next{
  background:linear-gradient(#1e1e1e,#151515);
  padding:10px;
  border-radius:14px;
  margin-bottom:8px;
  font-size:18px;
}
button{
  width:100%;
  padding:11px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#00b894,#019875);
  color:#fff;
  font-size:16px;
  font-weight:600;
}
button:active{transform:scale(.98)}
</style>
</head>

<body>

<div class="game">
  <div class="top">
    <div class="box">Score: <span id="score">0</span></div>
    <div class="box">PRO+</div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <div class="next">Next: <span id="next">128</span></div>
    <button onclick="resetGame()">Restart</button>
  </div>
</div>

<audio id="dropSound" src="https://assets.mixkit.co/sfx/preview/mixkit-soft-click-1123.mp3"></audio>
<audio id="mergeSound" src="https://assets.mixkit.co/sfx/preview/mixkit-game-success-alert-2039.mp3"></audio>

<script>
const COLS=5, MAX_HEIGHT=6;
let board=[], score=0, nextTile;

const boardDiv=document.getElementById("board");
const scoreSpan=document.getElementById("score");
const nextSpan=document.getElementById("next");
const dropSound=document.getElementById("dropSound");
const mergeSound=document.getElementById("mergeSound");

function randomTile(){
  return [16,32,64,128][Math.floor(Math.random()*4)];
}

function init(){
  board=Array.from({length:COLS},()=>[]);
  score=0;
  nextTile=randomTile();
  draw();
}

function draw(){
  boardDiv.innerHTML="";
  scoreSpan.textContent=score;
  nextSpan.textContent=nextTile;

  board.forEach((col,i)=>{
    const c=document.createElement("div");
    c.className="col";
    c.onclick=()=>drop(i);

    col.forEach(v=>{
      const t=document.createElement("div");
      t.className="tile n"+v+(v>=8192?" crown":"");
      t.textContent=v>=8192?"👑 "+v:v;
      c.appendChild(t);
    });
    boardDiv.appendChild(c);
  });
}

function drop(i){
  if(board[i].length>=MAX_HEIGHT) return;

  dropSound.currentTime=0; dropSound.play();
  board[i].push(nextTile);

  let merged=true;
  while(merged && board[i].length>=2){
    let a=board[i].at(-1), b=board[i].at(-2);
    if(a===b){
      board[i].pop(); board[i].pop();
      let nv=a*2;
      board[i].push(nv);
      score+=nv;
      mergeSound.currentTime=0; mergeSound.play();
    } else merged=false;
  }

  nextTile=randomTile();
  draw();
  checkGameOver();
}

function checkGameOver(){
  if(board.every(c=>c.length>=MAX_HEIGHT)){
    alert("Game Over\nScore: "+score);
  }
}

function resetGame(){init()}
init();
</script>

</body>
</html>
