<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Swipe Drop Merge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#0b1020;
  font-family:system-ui;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:#fff;
}
.game{width:360px}
.board{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(7,50px);
  gap:6px;
  background:#111634;
  padding:8px;
  border-radius:16px;
}
.cell{
  background:#1a1f40;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:16px;
}
.tile{
  position:absolute;
  width:50px;height:50px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  transition:.15s;
}
.n16{background:#00b894}
.n32{background:#0984e3}
.n64{background:#6c5ce7}
.merge{
  animation:merge .4s ease-in-out;
}
@keyframes merge{
  0%{transform:scale(1)}
  50%{transform:scale(1.3)}
  100%{transform:scale(1)}
}
</style>
</head>

<body>

<div class="game">
  <div class="board" id="board"></div>
</div>

<script>
const COLS=6, ROWS=7;
const board=[];
const boardDiv=document.getElementById("board");

let activeTile=null;
let activeCol=2;
let dropping=false;

for(let r=0;r<ROWS;r++){
  board[r]=Array(COLS).fill(0);
}

/* Draw grid */
function draw(){
  boardDiv.innerHTML="";
  board.forEach(row=>{
    row.forEach(v=>{
      const c=document.createElement("div");
      c.className="cell";
      c.textContent=v||"";
      if(v) c.classList.add("n"+v);
      boardDiv.appendChild(c);
    });
  });
}

/* Spawn falling tile */
function spawn(){
  activeCol=Math.floor(COLS/2);
  activeTile={value:Math.random()<0.7?16:32,row:0,col:activeCol};
  renderActive();
}

/* Render falling tile */
function renderActive(){
  let t=document.getElementById("active");
  if(!t){
    t=document.createElement("div");
    t.id="active";
    t.className="tile n"+activeTile.value;
    t.textContent=activeTile.value;
    document.body.appendChild(t);
  }
  const rect=boardDiv.getBoundingClientRect();
  t.style.left=rect.left+activeTile.col*56+"px";
  t.style.top=rect.top-60+"px";
}

/* Drop tile */
function drop(){
  if(dropping) return;
  dropping=true;
  let r=0;
  while(r+1<ROWS && board[r+1][activeCol]===0) r++;
  board[r][activeCol]=activeTile.value;
  document.getElementById("active").remove();
  activeTile=null;
  mergeCheck(r,activeCol);
  setTimeout(()=>{dropping=false;spawn()},500);
}

/* Merge logic */
function mergeCheck(r,c){
  const v=board[r][c];
  let merged=false;

  const dirs=[[0,1],[1,0],[0,-1],[-1,0]];
  dirs.forEach(d=>{
    const nr=r+d[0], nc=c+d[1];
    if(board[nr]?.[nc]===v){
      board[r][c]=v*2;
      board[nr][nc]=0;
      merged=true;
    }
  });

  draw();

  if(merged){
    const cell=boardDiv.children[r*COLS+c];
    cell.classList.add("merge");
    setTimeout(()=>mergeCheck(r,c),400);
  }
}

/* Swipe control */
let startX=0,startY=0;
document.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
  startY=e.touches[0].clientY;
});

document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-startX;
  const dy=e.changedTouches[0].clientY-startY;

  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>30 && activeCol<COLS-1) activeCol++;
    if(dx<-30 && activeCol>0) activeCol--;
    renderActive();
  }else{
    if(dy>30) drop();
  }
});

/* Init */
draw();
spawn();
</script>

</body>
</html>
