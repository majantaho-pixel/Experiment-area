<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Screenshot-Style Ludo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1220;
  color:#fff;
  text-align:center;
}
header{
  padding:10px;
  font-size:20px;
  font-weight:bold;
  background:rgba(0,0,0,0.5);
}

/* BOARD */
#board{
  width:450px;
  height:450px;
  margin:10px auto;
  display:grid;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  border:4px solid gold;
  background:#111827;
  box-shadow:0 0 20px gold;
}
.cell{
  border:1px solid rgba(255,255,255,.1);
  position:relative;
}
.safe{
  background:rgba(255,255,255,.15);
}

/* CENTER */
.center{
  grid-column:7/10;
  grid-row:7/10;
  background:linear-gradient(45deg,red,green,yellow,blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  border-radius:10px;
}

/* TOKEN */
.token{
  width:16px;
  height:16px;
  border-radius:50%;
  position:absolute;
  cursor:pointer;
  margin:2px;
  box-shadow:0 0 8px #000;
  transition:.2s;
}
.token:hover{transform:scale(1.2)}
.red{background:#dc2626}
.green{background:#16a34a}
.yellow{background:#facc15}
.blue{background:#2563eb}

/* PANEL */
#panel{
  background:rgba(0,0,0,.5);
  padding:10px;
}
button{
  padding:10px 18px;
  font-size:16px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:#fff;
  cursor:pointer;
}
button:active{transform:scale(.95)}
#dice{
  font-size:32px;
  margin:5px;
  animation:none;
}
.roll{
  animation:shake .6s;
}
@keyframes shake{
  0%{transform:rotate(0)}
  25%{transform:rotate(20deg)}
  50%{transform:rotate(-20deg)}
  75%{transform:rotate(20deg)}
  100%{transform:rotate(0)}
}
</style>
</head>

<body>

<header>🎲 Screenshot-Style Ludo</header>

<div>
Players:
<select id="playerCount">
<option value="2">2 Players</option>
<option value="3">3 Players</option>
<option value="4" selected>4 Players</option>
</select>
<button onclick="startGame()">Start</button>
</div>

<div id="board"></div>

<div id="panel">
<h3 id="turnInfo"></h3>
<div id="dice">🎲</div>
<button onclick="rollDice()">Roll Dice</button>
<button onclick="resetGame()">Reset</button>
</div>

<audio id="diceSound">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-dice-roll-1992.mp3">
</audio>

<script>
const board=document.getElementById("board");

/* BUILD BOARD */
for(let i=0;i<225;i++){
  const c=document.createElement("div");
  c.className="cell";
  c.id="c"+i;
  board.appendChild(c);
}

/* CENTER */
const center=document.createElement("div");
center.className="center";
center.innerText="LUDO";
board.appendChild(center);

/* SAFE CELLS */
const safe=[7,37,67,97,127,147,177,207];
safe.forEach(i=>document.getElementById("c"+i).classList.add("safe"));

/* PATH */
const path=[7,22,37,52,67,82,97,112,127,
128,129,130,131,132,
147,162,177,192,207,
208,193,178,163,148,133,
118,103,88,73,58,
57,56,55,54,53,
38,23,8
];

const colors=["red","green","yellow","blue"];
const names=["Red","Green","Yellow","Blue"];

let game;

/* START */
function startGame(){
  const count=parseInt(document.getElementById("playerCount").value);
  game={
    players:[],
    turn:0,
    dice:0,
    count:count
  };
  for(let i=0;i<count;i++){
    game.players.push({color:colors[i],tokens:[-1,-1,-1,-1]});
  }
  save();
  render();
}

/* SAVE & LOAD */
function save(){localStorage.setItem("screenshotLudo",JSON.stringify(game));}
game=JSON.parse(localStorage.getItem("screenshotLudo"));
if(game) render();

/* RENDER */
function render(){
  document.querySelectorAll(".token").forEach(t=>t.remove());
  game.players.forEach((p,pi)=>{
    p.tokens.forEach((pos,ti)=>{
      if(pos>=0){
        const t=document.createElement("div");
        t.className="token "+p.color;
        t.onclick=()=>selectToken(pi,ti);
        document.getElementById("c"+path[pos]).appendChild(t);
      }
    });
  });
  document.getElementById("turnInfo").innerText="Turn: "+names[game.turn];
}

/* DICE */
function rollDice(){
  const d=document.getElementById("dice");
  d.classList.add("roll");
  document.getElementById("diceSound").play();
  setTimeout(()=>{
    game.dice=Math.floor(Math.random()*6)+1;
    d.innerText="🎲 "+game.dice;
    d.classList.remove("roll");
  },600);
}

/* TOKEN SELECT */
function selectToken(playerIndex,tokenIndex){
  if(playerIndex!==game.turn) return;

  let p=game.players[playerIndex];
  let pos=p.tokens[tokenIndex];

  // bring out on 6
  if(pos===-1){
    if(game.dice===6) p.tokens[tokenIndex]=0;
    else return;
  }else{
    if(pos+game.dice>=path.length) return;
    p.tokens[tokenIndex]+=game.dice;
  }

  // CUT (not on safe)
  game.players.forEach((op,oi)=>{
    if(oi!==playerIndex){
      op.tokens=op.tokens.map(t=>{
        if(t===p.tokens[tokenIndex] && !safe.includes(path[t])) return -1;
        return t;
      });
    }
  });

  // NEXT TURN
  if(game.dice!==6)
    game.turn=(game.turn+1)%game.count;

  save();
  render();
}

/* RESET */
function resetGame(){
  localStorage.removeItem("screenshotLudo");
  location.reload();
}

</script>

</body>
</html>
